<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Naiara Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f0d;
            --bg-card: #171a15;
            --line: rgba(242, 237, 224, 0.12);
            --text: #f2ede0;
            --text-muted: #b6b2a3;
            --sage: #8fa17f;
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Jost', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            padding: 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            padding: 2.2rem 1.8rem;
        }
        h1 {
            font-family: var(--font-display);
            font-weight: 300;
            font-size: 1.6rem;
            margin-bottom: .4rem;
        }
        h1 em { color: var(--sage); font-style: italic; }
        p {
            color: var(--text-muted);
            font-size: .85rem;
            margin-bottom: 1.6rem;
        }
        label {
            display: block;
            font-size: .75rem;
            color: var(--text-muted);
            margin-bottom: .35rem;
            letter-spacing: .04em;
        }
        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--line);
            color: var(--text);
            padding: .75rem .9rem;
            font-family: inherit;
            font-size: .95rem;
            margin-bottom: 1.2rem;
        }
        input:focus {
            outline: 1px solid var(--sage);
            border-color: var(--sage);
        }
        button {
            width: 100%;
            padding: .85rem;
            background: var(--sage);
            color: #0d0f0d;
            border: 1px solid var(--sage);
            font-family: inherit;
            font-size: .9rem;
            letter-spacing: .04em;
            cursor: pointer;
        }
        button:hover {
            background: transparent;
            color: var(--sage);
        }
        .erro {
            background: rgba(190, 90, 90, 0.15);
            color: #c98080;
            font-size: .82rem;
            padding: .7rem .9rem;
            margin-bottom: 1rem;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 1.4rem;
            font-size: .8rem;
            color: var(--text-muted);
            text-decoration: none;
        }
        .back:hover { color: var(--sage); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Naiara <em>Studio</em></h1>
        <p>Acesso restrito ao painel administrativo.</p>

        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required autofocus placeholder="Digite a senha">
            <button type="submit">Entrar</button>
        </form>

        <a class="back" href="/">← Voltar ao site</a>
    </div>
</body>
</html>
